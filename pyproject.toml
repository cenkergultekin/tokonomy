[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tokonomy"
version = "0.2.0"
description = "Local token accounting for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Cenker Gültekin" }]
keywords = ["ai", "usage", "tokens", "codex", "claude-code", "observability", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["zstandard>=0.23,<1", "textual>=0.89,<2"]

[project.urls]
Homepage = "https://github.com/cenkergultekin/tokonomy"
Repository = "https://github.com/cenkergultekin/tokonomy"
Issues = "https://github.com/cenkergultekin/tokonomy/issues"

[project.scripts]
tokonomy = "tokonomy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokonomy = ["assets/*.ttf", "assets/OFL.txt"]
