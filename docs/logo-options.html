<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tokonomy logo çalışmaları</title><style>
@font-face{font-family:Outfit;src:url(fonts/outfit.ttf)}*{box-sizing:border-box}body{margin:0;background:#12232b;color:#eedfcd;font:16px Outfit,sans-serif}main{max-width:1500px;margin:auto;padding:40px}header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:38px}h1{font-size:26px;font-weight:500;margin:0}a{color:inherit}header a{font-size:15px;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0}.option{border:0;border-bottom:1px solid #ffffff12;background:transparent;color:#e5b38a;min-height:260px;display:flex;align-items:center;justify-content:center;gap:28px;flex-direction:column;cursor:pointer}.option svg{width:116px;height:116px;transition:transform .2s}.option span{color:#b9c9cc;font:15px Outfit}.option:hover svg{transform:translateY(-5px)}.option[aria-pressed=true]{background:#ffffff07}.option:focus-visible,a:focus-visible{outline:2px solid #e5b38a;outline-offset:-3px}.detail{display:flex;align-items:center;justify-content:space-between;gap:30px;padding-top:38px}.detail h2{font-size:22px;font-weight:500}.sizes{display:flex;align-items:center;gap:24px;color:#e5b38a}.sizes svg:nth-child(1){width:20px}.sizes svg:nth-child(2){width:40px}.sizes svg:nth-child(3){width:80px}.inverse{display:flex;background:#e5b38a;color:#12232b;padding:14px}.inverse svg{width:50px}#download{display:flex;align-items:center;gap:12px;text-decoration:none}#download svg{width:22px} @media(max-width:700px){main{padding:24px}.grid{grid-template-columns:repeat(2,1fr)}.option{min-height:210px}.detail{flex-wrap:wrap}header{gap:24px}h1{font-size:22px}}@media(prefers-reduced-motion:reduce){.option svg{transition:none}}
</style><main><header><h1>tokonomy / logo çalışmaları</h1><a href="index.html">Web tasarımı</a></header><div class="grid"><button class="option" data-name="Kesit" data-id="kesit" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M50 8a42 42 0 1 0 42 42A42 42 0 0 0 50 8ZM24 28Q50 17 76 28L72 40Q64 36 57 35L53 75H40L44 35Q35 36 28 41Z"/></svg><span>Kesit</span></button><button class="option" data-name="Kıvrım" data-id="kivrim" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path d="M39 12h15v22h24v13H54v20q0 13 14 13h10v13H65Q39 93 39 68V47H21V34h18Z"/></svg><span>Kıvrım</span></button><button class="option" data-name="Çentik" data-id="centik" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M29 8h42l21 21v42L71 92H29L8 71V29Zm-8 22v13h22v35h14V43h22V30Z"/></svg><span>Çentik</span></button><button class="option" data-name="Denge" data-id="denge" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path d="M10 26 50 10 90 26V39H59V86H41V39H10Z"/></svg><span>Denge</span></button><button class="option" data-name="Akış" data-id="akis" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path d="M13 30Q47 8 86 26l-5 13q-13-7-25-7v43q0 15-16 15H26V76h12q4 0 4-5V32q-12 2-24 10Z"/></svg><span>Akış</span></button><button class="option" data-name="Mühür" data-id="muhur" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M25 9h50q16 0 16 16v50q0 16-16 16H25Q9 91 9 75V25Q9 9 25 9Zm17 12v19H25v12h17v17q0 13 16 13h13V69H60q-4 0-4-5V52h19V40H56V21Z"/></svg><span>Mühür</span></button><button class="option" data-name="Halka" data-id="halka" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path d="M44 9A42 42 0 1 0 91 40H70v13h8a28 28 0 1 1-34-30v48h13V9Z"/></svg><span>Halka</span></button><button class="option" data-name="Düğüm" data-id="dugum" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M40 10h15v19h13q24 0 24 24T68 77H55v14H40V77H29Q7 77 7 53t22-24h11Zm0 33H29q-8 0-8 10t8 10h11Zm15 0v20h13q10 0 10-10T68 43Z"/></svg><span>Düğüm</span></button><button class="option" data-name="Kat" data-id="kat" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path d="M15 15H85L68 32H58V68L40 86V32H15Z"/></svg><span>Kat</span></button><button class="option" data-name="İz" data-id="iz" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M50 8A42 42 0 1 1 8.1 49H43V84H57V49H76V37H10.1A42 42 0 0 1 50 8Z"/></svg><span>İz</span></button></div><div class="detail"><h2 id="name">Kesit</h2><div class="sizes" id="sizes"></div><div class="inverse" id="inverse"></div><a id="download" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg>SVG</a></div></main><script>
let blob;
function select(button){document.querySelectorAll('.option').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const svg=button.querySelector('svg').outerHTML;document.querySelector('#name').textContent=button.dataset.name;document.querySelector('#sizes').innerHTML=svg.repeat(3);document.querySelector('#inverse').innerHTML=svg;if(blob)URL.revokeObjectURL(blob);blob=URL.createObjectURL(new Blob([svg.replace('currentColor','#e5b38a').replace('aria-hidden="true"','role="img" aria-label="tokonomy"')],{type:'image/svg+xml'}));const link=document.querySelector('#download');link.href=blob;link.download='tokonomy-'+button.dataset.id+'.svg'}
document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>select(b)));select(document.querySelector('.option'));
</script></html>
